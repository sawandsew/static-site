<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saw &amp; Sew</title>
<meta name="description" content="Saw &amp; Sew no longer sells furniture. Datafurn builds on the technology first built at Saw &amp; Sew.">
<link rel="canonical" href="https://sawandsew.com/">
<style>
  body {
    margin: 0;
    background: #11111f;
    color: #11111f;
    font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .hero {
    position: relative;
    box-sizing: border-box;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: flex-end;
    padding: 1.5rem;
  }
  .hero-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .panel {
    position: relative;
    max-width: 24rem;
    padding: 1.5rem;
    background: rgba(255, 255, 255, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 22px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
  }
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .panel {
      background: rgba(255, 255, 255, 0.5);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      backdrop-filter: blur(28px) saturate(180%);
    }
  }
  h1 { margin: 0 0 1rem; line-height: 0; }
  h1 img { width: 150px; max-width: 100%; height: auto; }
  p { margin: 0 0 0.75rem; }
  p:last-child { margin-bottom: 0; }
  a { color: inherit; }
  @media (max-width: 40rem) {
    .hero { padding: 1rem; }
    .panel { max-width: none; padding: 1.25rem; }
  }
  /* Tall, narrow screens: show more of the picture by letting it fill
     the top of the screen and fade into the background colour. */
  @media (max-width: 40rem) and (orientation: portrait) {
    .hero-image {
      height: 68vh;
      height: 68svh;
      -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent);
      mask-image: linear-gradient(to bottom, #000 78%, transparent);
    }
  }
</style>
</head>
<body>

<main class="hero">
  <img class="hero-image" src="hero.webp" width="2400" height="1200" alt="" fetchpriority="high">

  <div class="panel">
    <h1><img src="logo-update.png" width="300" height="50" alt="Saw &amp; Sew"></h1>

    <p>Saw &amp; Sew no longer sells furniture.</p>

    <p><a href="https://datafurn.com/">Datafurn</a> builds on the technology first built at Saw &amp; Sew. It keeps new sizes and variants of a product within a CNC shop's machine and material limits.</p>

    <p>Contact: <a href="mailto:info@sawandsew.com">info@sawandsew.com</a></p>
  </div>
</main>

</body>
</html>
